# deploy/redate-compose.local.yml
# ==============================================================================
# ReDate Local Deployment (Self-Hosted)
# ==============================================================================
name: redate-local

services:
  # --------------------------------------------------------------------------
  # Service: Network Proxy (Sidecar)
  # --------------------------------------------------------------------------
  proxy-sidecar:
    image: gogost/gost:3.2
    container_name: redate-proxy-local
    read_only: true
    restart: unless-stopped
    volumes:
      # 挂载配置文件
      - ./config/gost-client.yaml:/etc/gost/config.yaml:ro
      # 挂载凭证 (确保本地有这些文件)
      - ./secrets/certs:/certs:ro
      - ./secrets/ssh:/ssh:ro
    ports:
      # 仅在本地暴露 SOCKS5 端口供调试，容器间通过网络通讯
      - "127.0.0.1:1080:1080"
    networks:
      - redate-mesh
    healthcheck:
      test: ["CMD", "gost", "-V"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------------------------
  # Service: Application Worker
  # --------------------------------------------------------------------------
  app-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: redate-news:local
    container_name: redate-worker-local
    # 保持容器运行以便通过 exec 执行命令，或者配合 crontab 使用
    # 在生产中通常是一次性任务，但在本地 Compose 中常用 tail -f 保持
    entrypoint: ["tail", "-f", "/dev/null"] 
    environment:
      - APP_ENV=dev
      - LOG_LEVEL=INFO
      # 指向 Sidecar 服务名
      - ALL_PROXY=socks5://proxy-sidecar:1080
      - WECHAT_PROXY_URL=socks5://proxy-sidecar:1080
      # 引用 .env 文件中的变量
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WECHAT_APP_ID=${WECHAT_APP_ID}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET}
    volumes:
      # 本地开发时挂载源码，实现热重载 (可选)
      - ./src/redate:/app/redate
      # 数据持久化
      - ./data:/app/data
    networks:
      - redate-mesh
    depends_on:
      proxy-sidecar:
        condition: service_healthy

networks:
  redate-mesh:
    driver: bridge