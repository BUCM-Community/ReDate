# gost-client.yaml
services:
  - name: local-proxy
    addr: :1080
    handler:
      type: socks5
    listener:
      type: tcp
    forwarder:
      nodes:
        - name: fallback-group
          # 引用下方定义的转发链
          link: fallback-chain

chains:
  - name: fallback-chain
    hops:
      - name: vps-gateway
        # 故障转移策略：按顺序尝试，失败则切换下一个
        interface:
          type: failover
        nodes:
          # Priority 1: QUIC (UDP 443, High Performance)
          - name: primary-quic
            addr: ${VPS_HOST}:8443
            connector:
              type: socks5
              metadata:
                connectTimeout: 3s
            dialer:
              type: quic
              tls:
                certFile: /certs/client.crt
                keyFile: /certs/client.key
                caFile: /certs/ca.crt
                serverName: redate.proxy

          # Priority 2: WSS (WebSocket Secure, High Penetration)
          - name: secondary-wss
            addr: ${VPS_HOST}:8444
            connector:
              type: socks5
            dialer:
              type: wss
              path: /redate-tunnel
              tls:
                certFile: /certs/client.crt
                keyFile: /certs/client.key
                caFile: /certs/ca.crt
                serverName: redate.proxy

          # Priority 3: SSH (Fallback, High Latency but Stable)
          - name: tertiary-ssh
            addr: ${VPS_HOST}:8445
            connector:
              type: socks5
            dialer:
              type: ssh
              auth:
                type: key
                keyFile: /ssh/id_rsa # 这里的私钥对应 VPS 上的 authorized_keys