[workspace] 
name = "redate"
version = "0.1.0"
description = "Production-grade News Aggregation & Publishing Platform"
authors = ["BUCM-Community <bcnn@beginner.center>"]
license = "MPL-2.0"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/BUCM-Community/ReDate"
channels = ["conda-forge"]
# 加入全平台支持，方便本地调试
platforms = ["linux-64", "win-64", "osx-arm64", "osx-64", "win-arm64"]
requires-pixi = ">=0.63.0"

[tasks]
# Application Lifecycle
start = "python src/main.py"
start-daily = "python src/main.py daily"
start-weekly = "python src/main.py weekly"
start-yearly = "python src/main.py yearly"

# Quality Assurance
lint = { cmd = "ruff check src tests", description = "Run static analysis" }
format = { cmd = "ruff format src tests", description = "Auto-format code" }
typecheck = { cmd = "mypy src", description = "Run static type checking" }
test = { cmd = "pytest tests", description = "Run unit tests" }
coverage = { cmd = "pytest --cov=src --cov-report=xml:coverage.xml --cov-report=term", description = "Run tests with coverage" }
contract-check = { cmd = "lint-imports", description = "Enforce architectural layers" }

# Documentation
docs-serve = "mkdocs serve"
docs-build = "mkdocs build"
docs-deploy = { cmd = "mkdocs gh-deploy --force", description = "Build and deploy documentation to GitHub Pages" }

# ==========================================
# 核心依赖 (Conda-forge)
# 包含解释器、二进制工具和重计算库
# ==========================================
[dependencies]
python = "3.12.*"
# conda分发会自动链接优化库
numpy = ">=2.1.0" 
# 显式加入 ca-certificates，防止 Windows/Mac 下企业内网 SSL 报错
ca-certificates = "*"

# ==========================================
# 业务依赖 (PyPI)
# 纯 Python 库，或迭代极快的 AI/Web 库
# ==========================================
[pypi-dependencies]
# Core Async & Web
aiohttp = ">=3.13.3"
typer = ">=0.21.1"
pydantic = ">=2.12.5, <3"
pydantic-settings = ">=2.12.0, <3"
tenacity = ">=9.1.2, <10"
beautifulsoup4 = ">=4.14.3, <5"

# Observability
structlog = ">=25.5.0, <26"

# Data & AI
lancedb = ">=0.26.1, <0.27" 
google-genai = ">=1.57.0, <2"
aioboto3 = ">=15.5.0, <16"
types-aiobotocore-s3 = ">=3.1.0, <4"
orjson = ">=3.10.3, <4"

# ==========================================
# 功能特性 (Features)
# ==========================================
[feature.dev.dependencies]
ruff = ">=0.14.0, <0.15"
mypy = ">=1.19.1"
pytest = ">=9.0.2, <10"
pytest-cov = ">=7.0.0, <8"
pytest-asyncio = ">=0.23.6, <1"
pytest-mock = ">=3.15.1"
import-linter = ">=2.9, <3"

[feature.docs.dependencies]
mkdocs = ">=1.6.1"
mkdocs-material = ">=9.7.1, <10"
mkdocstrings = ">=1.0.0, <2"
mkdocstrings-python = ">=2.0.1, <3"

[feature.build.dependencies]
uv = ">=0.9.25"

[environments]
# 使用 solve-group 确保环境共享完全相同的核心依赖版本
# no-default-feature = false 是默认值
# 1. 开发环境：包含核心代码(默认) + 开发工具 + 文档工具
default = { features = ["dev", "docs"], solve-group = "redate-lifecycle" }

# 2. 生产环境：包含核心代码(默认) + 构建/部署工具
prod = { features = ["build"], solve-group = "redate-lifecycle" }

# 3. 纯净测试环境：仅包含核心 + 基础测试，用于 CI 流水线
ci = { features = ["dev"], solve-group = "redate-lifecycle" }