[workspace]
name = "redate"
version = "0.3.0"
description = "Production-grade News Aggregation & Publishing Platform"
authors = ["BUCM-Community <bcnn@beginner.center>"]
license = "MPL-2.0"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/BUCM-Community/ReDate"
channels = ["conda-forge"]
# 包含主流架构，确保跨平台开发环境一致
platforms = ["linux-64", "win-64", "osx-arm64"]
requires-pixi = ">=0.63.2"

# ==========================================
# 任务编排 (Tasks)
# ==========================================
[tasks]
# --- Meta Sync ---
export-meta = { cmd = "python scripts/sync_meta.py", description = "Sync pyproject.toml metadata using tomlkit" }

# --- CI Pipeline ---
# 单一跨环境 CI 编排
ci-build = { cmd = "dagger run -- python ci/main.py", depends-on = ["lint", "typecheck", "contract-check"] }

# --- Lifecycle ---
start = "python -m redate.main"
start-daily = "python -m redate.main daily"
start-weekly = "python -m redate.main weekly"
start-yearly = "python -m redate.main yearly"

# --- QA & Security ---
lint = { cmd = "ruff check src/redate tests scripts --config ops/config/ruff.toml", description = "Run static analysis" }
format = { cmd = "ruff format src/redate tests scripts --config ops/config/ruff.toml", description = "Auto-format code" }
typecheck = { cmd = "mypy src/redate --config-file ops/config/mypy.toml", description = "Run strict static type checking" }
contract-check = { cmd = "lint-imports --config ops/config/importlinter.ini", description = "Enforce architectural layers checks" }

# --- Testing ---
test = { cmd = "pytest tests", description = "Run unit tests" }
coverage = { cmd = "python -m pytest --cov=redate --cov-report=xml:coverage.xml --cov-report=term", description = "Run tests with coverage" }

# --- Utils ---
clean = { cmd = "python -c \"import shutil, os; [shutil.rmtree(p, ignore_errors=True) for p in ['dist', 'site', '.pytest_cache', '.ruff_cache', '.mypy_cache', 'coverage.xml', '.coverage'] if os.path.exists(p)]\"", description = "Clean build artifacts" }

# --- Documentation ---
docs-serve = "mkdocs serve"
docs-build = "mkdocs build"

# ==========================================
# 全局Conda依赖 (Common Dependencies)
# ==========================================
[dependencies]
# computation
numpy = ">=2.4.0, <3"
pyarrow = ">=23.0.0, <24"
# 显式加入 ca-certificates，使用与系统独立且一致的SSL证书
ca-certificates = "*"

# ==========================================
# 全局PyPI 依赖 (Business Logic)
# ==========================================
# 中国开发者可以配置pypi镜像加速下载
# [pypi-options]
# index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
# extra-index-urls = [
#     "https://pypi.org/simple",
#     "https://mirrors.sustech.edu.cn/pypi/web/simple",
#     "https://files.pythonhosted.org/packages",
# ]

[pypi-dependencies]

# --- 业务库 ---
aiohttp = ">=3.13.3, <4"
typer = ">=0.21.1"
pydantic = ">=2.12.5, <3"
pydantic-settings = ">=2.12.0, <3"
tenacity = ">=9.1.2, <10"
beautifulsoup4 = ">=4.14.3, <5"
structlog = ">=25.5.0, <26"

# --- Data & AI ---
lancedb = ">=0.26.1, <0.27"
google-genai = ">=1.59.0, <2"
openai = ">=2.15.0, <3"
aioboto3 = ">=15.5.0, <16"
types-aiobotocore-s3 = ">=3.1.0, <4"

# ==========================================
# 特性 (Features) - 定义模块化的依赖集
# ==========================================

# --- Python 版本矩阵 ---
# 目前三方库版本比较新，有些已不支持py310，本项目不去除GIL
[feature.py311]
dependencies = { python = "3.11.*" }
[feature.py312]
dependencies = { python = "3.12.*" }
[feature.py313]
dependencies = { python = "3.13.*" }
[feature.py314]
dependencies = { python = "3.14.*" }

# --- 开发工具链 ---
[feature.dev.pypi-dependencies]

# --- 项目自身的 Editable 安装 ---
# 在 site-packages 内生成 .pth 指向项目根目录，使得 'import redate' 路径查找生效，修改代码无需重装。
redate = { path = ".", editable = true }

ruff = ">=0.14.13"
mypy = ">=1.19.1"
import-linter = ">=2.9"
tomlkit = ">=0.14.0"

# --- pytest 生态 & 远程服务测试 ---
[feature.test.pypi-dependencies]

# --- 项目自身的 Editable 安装 ---
# 在 site-packages 内生成 .pth 指向项目根目录，使得 'import redate' 路径查找生效，修改代码无需重装。
redate = { path = ".", editable = true }

pytest = ">=9.0.2, <10"
pytest-cov = ">=7.0.0, <8"
pytest-asyncio = ">=0.23.6"
pytest-mock = ">=3.15.1, <4"
moto = ">=5.1.20, <6"
respx = ">=0.22.0, <0.23"

# --- 文档工具链 ---
[feature.docs.pypi-dependencies]
mkdocs = ">=1.6.1, <2"
mkdocs-material = ">=9.7.1"
mkdocstrings = ">=1.0.0"
mkdocstrings-python = ">=2.0.1"

# --- 编排工具链 ---
[feature.ci.pypi-dependencies]
# 打包项目为wheel
build = "*"
# 跨平台CI编排工具
dagger-io = ">=0.19.10, <0.20"

# ==========================================
# 环境 (Environments) - 组合特性
# ==========================================
[environments]
# solve-group 确保 dev 和 prod 的核心库版本严格一致

# 1. 默认开发环境 (Local Development)
# 包含：Python 3.12 + 开发工具 + 测试工具 + 文档工具 + 编排工具
default = { features = ["py312", "dev", "test", "docs", "ci"], solve-group = "main-env" }

# 2. 生产部署环境 (Production)
prod = { features = ["py312"], solve-group = "main-env" }

# 3. Documentation Deploy (Isolated)
docs = { features = ["py312", "docs"] }

# 4. 流水线环境 (CI Runner)
# 测试在容器里跑
ci = { features = ["ci", "dev"], solve-group = "main-env" }

# 5. Python 兼容性矩阵 (Python Matrix Testing) - 完全独立的Python多版本环境
test-311 = { features = ["py311", "test"] }
test-312 = { features = ["py312", "test"] } # 专门用于纯净测试
test-313 = { features = ["py313", "test"] }
test-314 = { features = ["py314", "test"] }

# ==========================================
# 平台特定覆盖 (Platform Specific Overrides)
# ==========================================
