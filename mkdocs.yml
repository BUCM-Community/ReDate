# ==========================================
# Project Metadata
# ==========================================
site_name: ReDate Documentation
site_description: "Production-grade Documentation for ReDate Platform"
site_url: https://docs.redate.io
repo_url: https://github.com/BUCM-Community/ReDate
repo_name: ReDate
edit_uri: edit/main/docs/

# ==========================================
# Theme Configuration
# ==========================================
theme:
  name: material
  language: en
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.expand
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
  palette:
    # Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# ==========================================
# Plugins
# ==========================================
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            merge_init_into_class: true
            show_category_heading: true
            show_submodules: false
            # Show type annotations explicitly
            show_signature_annotations: true

# ==========================================
# Markdown Extensions
# ==========================================
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - attr_list
  - pymdownx.details

# ==========================================
# Navigation / Structure
# ==========================================
nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture.md
      - Domain Models: reference/domain_models.md
      - Ports (Interfaces): reference/ports.md
      - Cli (Entry): reference/main.md
  - Core Logic:
      - Orchestrator: reference/service_news.md
      - Configuration: reference/config.md
  - Infrastructure (Adapters):
      - Viki News (Source): reference/adapter_viki.md
      - Gemini (LLM): reference/adapter_gemini.md
      - OpenAI (LLM): reference/adapter_openai.md
      - Storage (R2/LanceDB): reference/adapter_storage.md
      - WeChat (Publisher): reference/adapter_wechat.md
      - Image Fetcher: reference/adapter_image.md
  - Utilities:
      - Date Utils: reference/utils_date.md
      - Telemetry Utils: reference/utils_telemetry.md