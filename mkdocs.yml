# ==========================================
# Project Metadata (Adapted for ReDate News)
# ==========================================
site_name: ReDate API Reference
site_description: "development documentation for ReDate"
site_url: https://BUCM-Community.github.io/ReDate/
repo_url: https://github.com/BUCM-Community/ReDate
repo_name: ReDate
edit_uri: edit/dev/docs/

# ==========================================
# Theme Configuration
# ==========================================
theme:
  name: material
  language: zh
  features:
    - content.code.copy
    - navigation.expand
    - navigation.sections
    - navigation.top 
    - toc.follow
  palette: 
    # Light Mode
    - scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark Mode
    - scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# ==========================================
# Plugins
# ==========================================
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # 指向 src 目录，这样文档中可以使用 "::: main" 或 "::: service_news"
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            merge_init_into_class: true
            show_submodules: false

# ==========================================
# Markdown Extensions
# ==========================================
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - attr_list
  - pymdownx.details

# ==========================================
# Navigation / Structure
# ==========================================
nav:
  - 项目主页: index.md
  - 架构设计: architecture.md
  - API 参考:
      - 核心入口 (CLI):
          - Main: reference/main.md
          - Configuration: reference/config.md
      - 业务逻辑 (Service):
          - Orchestrator: reference/service_news.md
          - Domain Models: reference/domain_models.md
          - Interfaces (Ports): reference/ports.md
      - 基础设施 (Adapters):
          - Viki News (Source): reference/adapter_viki.md
          - Gemini (LLM): reference/adapter_gemini.md
          - Image (Unsplash): reference/adapter_image.md
          - WeChat (Publisher): reference/adapter_wechat.md
          - Storage (R2/LanceDB): reference/adapter_storage.md
      - 工具库 (Utils):
          - Date Utils: reference/utils_date.md
          - Telemetry Utils: reference/utils_telemetry.md