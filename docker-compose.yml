services:
  # ==========================================
  # 基础设施层
  # ==========================================
  proxy-sidecar:
    image: gogost/gost:3.2
    container_name: redate-proxy
    read_only: true
    volumes:
      - ./config/gost-client.yaml:/etc/gost/config.yaml:ro
      - ./secrets/certs:/certs:ro # 挂载证书
      - ./secrets/ssh:/ssh:ro     # 挂载 SSH Key
    networks:
      - secure-mesh
    # 健康检查：确保本地端口已开启
    healthcheck:
      test: ["CMD", "gost", "-V"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # 业务逻辑层 (共享基础镜像)
  # ==========================================
  base-worker:
    build: .
    image: redate-news:latest
    user: redate
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - secure-mesh
    deploy:
      mode: replicated
      replicas: 0 # 抽象基类，不运行

  # 1. 采集器 (直连网络，不需要代理)
  crawler:
    extends: base-worker
    command: ["crawl"]
    environment:
      - LOG_CONTEXT=crawler

  # 2. 索引器 (处理数据，访问 R2/Gemini)
  indexer:
    extends: base-worker
    command: ["index"] # 嵌入向量化
    environment:
      - LOG_CONTEXT=indexer
      # Gemini/R2 通常使用直连，如果 Google 被墙则指向 proxy
      # ALL_PROXY: "socks5://redate-proxy:1080"

  # 3. 分析师 (生成报告)
  reporter:
    extends: base-worker
    command: ["report"]
    environment:
      - LOG_CONTEXT=reporter

  # 4. 发布者 (敏感操作，强制走代理)
  publisher:
    extends: base-worker
    command: ["publish"]
    depends_on:
      proxy-sidecar:
        condition: service_healthy
    environment:
      - LOG_CONTEXT=publisher
      # 关键：指向 Sidecar 代理
      - ALL_PROXY=socks5://redate-proxy:1080
      - WECHAT_PROXY_URL=socks5://redate-proxy:1080

networks:
  secure-mesh:
    driver: bridge