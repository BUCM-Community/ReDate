name: ReDate Tests & Coverage

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'redate/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'pixi.toml'
      - '.github/workflows/test_coverage.yml'

jobs:
  test-matrix:
    name: Test (Python ${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 排查特定版本兼容性
      matrix:
        environment: [test-311, test-312, test-313, test-314]

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.63.1
          cache: true
          # 动态激活矩阵中对应的环境
          environments: ${{ matrix.environment }}

      - name: Run Tests with Coverage
        # 指定环境运行 coverage 任务
        run: pixi run --environment ${{ matrix.environment }} coverage

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          # 使用 flags 区分不同环境的报告
          flags: ${{ matrix.environment }}
          name: codecov-${{ matrix.environment }}
          fail_ci_if_error: true
          verbose: true