# .github/workflows/redate_pipeline.yml
name: ReDate Production Pipeline

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
  schedule:
    # 1. Daily Ingest: 北京时间 16:30 => UTC 08:30
    - cron: '30 8 * * *'
    
    # 2. Weekly Summary: 北京时间 周一 09:00 => UTC 01:00
    - cron: '0 1 * * 1'
    
    # 3. Yearly Summary: 北京时间 1月1日 10:00 => UTC 02:00
    - cron: '0 2 1 1 *'

  # 手动触发器
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Execution Mode (daily/weekly/yearly)'
        required: true
        default: 'daily'
        type: choice
        options: ['daily', 'weekly', 'yearly']
      target_date:
        description: 'Specific Date (YYYY-MM-DD, Optional for daily)'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: latest

jobs:
  # --- Stage 1: Quality Assurance ---
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 使用 setup-pixi 获得极速缓存
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.63.2
          cache: true
          # 仅安装 dev 环境用于检查
          environments: default

      - name: Verify Lockfile
        run: pixi install --locked

      - name: Architecture Contract Check
        run: pixi run contract-check

      - name: Lint & Format Check
        run: |
          pixi run lint
          pixi run format --check

      - name: Type Check
        run: pixi run typecheck

  # --- Stage 2: Build & Secure ---
  build-and-scan:
    needs: check-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # 用于上传 Trivy 结果
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建镜像并导出到本地 Docker Daemon (用于扫描)
      - name: Build and Load
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true # 导出到 Docker Daemon 以便后续扫描
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Security: 扫描镜像漏洞
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest'
          format: 'table'
          exit-code: '1' # 发现高危漏洞则失败
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Security: 生成 SBOM
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest'
          format: 'cyclonedx'
          output: 'sbom.cyclonedx.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 5

      # Push 镜像 (仅在非 PR 时)
      - name: Push Image
        if: github.event_name != 'pull_request'
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # --------------------------------------------------------------------------
  # Job 3: 业务执行 (Runtime Execution)
  # --------------------------------------------------------------------------
  execute-pipeline:
    name: Execute Logic (Sidecar Pattern)
    needs: build-and-scan
    # 仅在 定时任务(schedule) 或 手动触发(workflow_dispatch) 时运行业务逻辑
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 恢复镜像
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      
      - name: Load Docker Image
        run: docker load -i /tmp/redate_image.tar

      # 2. 配置网络隧道 (Gost Sidecar)
      - name: Configure Network Tunnel
        run: |
          mkdir -p secrets/certs secrets/ssh config
          # 注入证书与密钥
          echo "${{ secrets.GOST_CA_CRT }}" > secrets/certs/ca.crt
          echo "${{ secrets.GOST_CLIENT_CRT }}" > secrets/certs/client.crt
          echo "${{ secrets.GOST_CLIENT_KEY }}" > secrets/certs/client.key
          echo "${{ secrets.VPS_SSH_KEY }}" > secrets/ssh/id_rsa
          chmod 600 secrets/ssh/id_rsa
          
          # Ensure template exists or simple config is used
          if [ -f config/gost-client.template.yaml ]; then
             envsubst < config/gost-client.template.yaml > config/gost-client.yaml
          else
             # Fallback minimal config creation if template missing
             echo "services:" > config/gost-client.yaml
             echo "- name: service-0" >> config/gost-client.yaml
             echo "  addr: :1080" >> config/gost-client.yaml
             echo "  handler:" >> config/gost-client.yaml
             echo "    type: socks5" >> config/gost-client.yaml
             echo "  listener:" >> config/gost-client.yaml
             echo "    type: tcp" >> config/gost-client.yaml
          fi
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}

      # 3. 启动 Gost Sidecar (Network Mesh)
      # 所有的业务流量将通过 localhost:1080 (SOCKS5) 转发
      - name: Start Gost Sidecar
        run: |
          docker network create redate-mesh
          docker run -d --name gost-sidecar \
            --network redate-mesh \
            --restart always \
            -v $(pwd)/config:/config \
            -v $(pwd)/secrets:/secrets \
            gogost/gost:3.2 \
            -C /config/gost-client.yaml

      # 4. 确定业务指令 (Schedule Mapping)
      - name: Determine Command
        id: strategy
        run: |
          # 默认模式
          MODE="daily"
          DATE_ARG=""

          # Schedule 判定
          if [[ "${{ github.event.schedule }}" == "30 8 * * *" ]]; then
            MODE="daily"
            echo "Detected Daily Schedule (16:30 CST)"
          elif [[ "${{ github.event.schedule }}" == "0 1 * * 1" ]]; then
            MODE="weekly"
            echo "Detected Weekly Schedule (Mon 09:00 CST)"
          elif [[ "${{ github.event.schedule }}" == "0 2 1 1 *" ]]; then
            MODE="yearly"
            echo "Detected Yearly Schedule (Jan 1 10:00 CST)"
          fi

          # Manual Override
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ github.event.inputs.job_type }}"
            if [[ -n "${{ github.event.inputs.target_date }}" ]]; then
              DATE_ARG="--target-date ${{ github.event.inputs.target_date }}"
            fi
          fi

          echo "command=$MODE" >> $GITHUB_OUTPUT
          echo "args=$DATE_ARG" >> $GITHUB_OUTPUT

      # 5. 执行主容器 (Single Container Architecture)
      # 在 Docker 中，我们使用 --network container:gost-sidecar 模式来实现 Pod 级网络共享
      # 或者使用自定义网络并指向服务名 (setup: WECHAT_PROXY_URL=socks5://gost-sidecar:1080)
      - name: Run ReDate Core
        env:
          # 应用配置
          VIKI_API_BASE: ${{ secrets.VIKI_API_BASE }}
          
          # R2 存储
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          
          # AI 模型
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # 微信发布
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          # 关键: 在 redate-mesh 网络中，Gost 容器名为 gost-sidecar
          WECHAT_PROXY_URL: "socks5://gost-sidecar:1080"
          PYTHONPATH: "src" # 确保可以直接 import redate
          
        run: |
          docker run --rm \
            --network redate-mesh \
            --name redate-worker \
            -e VIKI_API_BASE \
            -e R2_ACCOUNT_ID -e R2_ACCESS_KEY_ID -e R2_SECRET_ACCESS_KEY -e R2_ENDPOINT -e R2_BUCKET_NAME \
            -e GEMINI_API_KEY \
            -e WECHAT_APP_ID -e WECHAT_APP_SECRET -e WECHAT_PROXY_URL \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            python -m src.main ${{ steps.strategy.outputs.command }} ${{ steps.strategy.outputs.args }}

      # 6. 日志归档
      - name: Collect Artifacts (Logs)
        if: always()
        run: |
          docker logs redate-worker > run.log 2>&1 || true
          docker logs gost-sidecar > proxy.log 2>&1 || true
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-logs
          path: "*.log"
          retention-days: 30
