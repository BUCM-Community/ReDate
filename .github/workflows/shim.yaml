# .github/workflows/shim.yml
# ==============================================================================
# The Dumb Runner
# Logic is DELEGATED to ci/main.py. This file only provides resources.
# ==============================================================================
name: Universal Pipeline

on:
  # CI Triggers
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
  
  # Workload Triggers
  schedule:
    # 1. Daily Ingest: 北京时间 16:30 => UTC 08:30
    - cron: '30 8 * * *'
    # 2. Weekly Summary: 北京时间 周一 09:00 => UTC 01:00
    - cron: '0 1 * * 1'
    # 3. Yearly Summary: 北京时间 1月1日 10:00 => UTC 02:00
    - cron: '0 2 1 1 *'

  # Manual Trigger
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Execution Mode (daily/weekly/yearly)'
        required: true
        default: 'daily'
        type: choice
        options: ['daily', 'weekly', 'yearly']
      target_date:
        description: 'Specific Date (YYYY-MM-DD)'
        required: false

permissions:
  contents: read
  packages: write # For GHCR Push

jobs:
  engine:
    name: Dagger Engine
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.63.2
          cache: true
          environments: ci

      - name: Invoke Main
        env:
          # --- Context (Critical for Logic) ---
          CI: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dagger needs this file to parse event details (schedule cron, inputs)
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          
          # --- Secrets (For Workload & Deploy) ---
          # Passed blindly; Python decides which to use.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          
          VPS_HOST: ${{ secrets.VPS_HOST }} # Only if GOST config needs interpolation
        run: |
          # The Python script will read GITHUB_EVENT_PATH to decide what to do
          pixi run ci-build