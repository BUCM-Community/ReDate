name: Feature Request
description: 建议一个新功能或改进
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        你有一个很棒的想法？告诉我们！
  - type: textarea
    id: problem
    attributes:
      label: 这个功能解决了什么痛点？
      description: 请描述相关的背景。
      placeholder: "目前的第三方HTTPS API无法使用，导致我必须手动..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案 (Proposed Solution)
      description: 您希望我们如何实现它？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考虑过其他解决方式？